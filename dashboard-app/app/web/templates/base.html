<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title }}</title>
  <style>
    :root{
      --green:#0d6b2b;
      --green2:#025502;
      --bg1: rgba(2,85,2,.08);
      --bg2: rgba(255,255,255,.92);
    }
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(13,107,43,.22), transparent 60%),
        radial-gradient(900px 500px at 85% 0%, rgba(2,85,2,.14), transparent 55%),
        linear-gradient(180deg, var(--bg1), rgba(255,255,255,.85) 40%, rgba(255,255,255,1));
    }
    header {
      padding: 14px 16px;
      background: linear-gradient(90deg, rgba(13,107,43,.95), rgba(2,85,2,.92));
      color: #fff;
      display:flex;
      gap:16px;
      align-items:center;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header a { color:#fff; text-decoration:none; opacity:.95; font-weight:700; }
    header a:hover { opacity:1; text-decoration: underline; }
    main { padding: 16px; max-width: 1400px; margin: 0 auto; }
    .card { border:1px solid rgba(0,0,0,.10); border-radius:16px; padding:12px; margin:12px 0; background: rgba(255,255,255,.88); box-shadow: 0 6px 20px rgba(0,0,0,.04); }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid rgba(0,0,0,.06); padding:8px; text-align:left; font-size: 14px; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .02em; opacity: .7; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .col { flex:1; min-width:280px; }
    input, button, select { padding:8px; font-size:14px; }
    button { cursor:pointer; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header>
  <div style="font-weight:700">{{ title }}</div>
  <a href="/dashboard">Dashboard</a>
  <a href="/mode">Cambiar modo</a>
  <a href="/debug">Debug</a>
  <!--<a href="/docs">API</a> -->
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
